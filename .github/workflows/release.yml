# Publish to PyPI via Trusted Publishing (no API token).
# One-time setup: add a pending publisher on pypi.org for this repo,
# workflow "release.yml", environment "pypi" (require manual approval on it).
# Release: bump swlp.__version__, update CHANGELOG, then `git tag vX.Y.Z && git push --tags`.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest   # pure-Python wheel; platform-independent build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/swlp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
