[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swlp"
version = "0.1.0"
description = "Phase 0 baseline runtime for a local LLM project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "transformers>=4.41",
  "accelerate>=0.33",
  "huggingface_hub>=0.24",
  "safetensors>=0.4",
  "python-json-logger>=2.0",
  "psutil>=5.9",
  "pyinstrument>=4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
gpu = [
  "pynvml>=11.5",
]
apple = [
  "mlx>=0.16",
  "mlx-lm>=0.16",
]

[project.scripts]
swlp = "swlp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
