[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swlp"
dynamic = ["version"]
description = "Sliding Window Layer Pipeline — run large LLMs on consumer hardware without quantization by streaming transformer layers through a sliding window."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Rishav Upadhaya", email = "rishavupadhaya266@gmail.com" },
]
keywords = [
  "llm", "inference", "transformers", "memory-efficient",
  "layer-streaming", "apple-silicon", "mlx", "fp16",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Environment :: GPU",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.41",
  "accelerate>=0.33",
  "huggingface_hub>=0.24",
  "safetensors>=0.4",
  "python-json-logger>=2.0",
  "psutil>=5.9",
  "rich>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
codec = [
  "zipnn>=0.5.4",
]
apple = [
  "mlx>=0.31; sys_platform == 'darwin'",
  "mlx-lm>=0.31; sys_platform == 'darwin'",
]

[project.scripts]
swlp = "swlp.cli:main"

[project.urls]
Homepage = "https://github.com/Rishav-Upadhaya/SWLP"
Source = "https://github.com/Rishav-Upadhaya/SWLP"
Issues = "https://github.com/Rishav-Upadhaya/SWLP/issues"
Documentation = "https://github.com/Rishav-Upadhaya/SWLP/tree/main/docs"
Changelog = "https://github.com/Rishav-Upadhaya/SWLP/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "swlp.__version__"}

[tool.setuptools.package-data]
swlp = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Research scripts print wide fixed-width result tables.
"scripts/**" = ["E501"]
