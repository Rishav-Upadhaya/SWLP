# SWLP speculative-decoding config for Mistral-7B on M5 (Apple Silicon, MPS).
# Phase 5: prompt-lookup (n-gram) speculative decoding. An n-gram drafter
# proposes up to swlp_spec_max_draft tokens; the streamed target model verifies
# them all in a single 32-layer disk sweep. Output is bit-identical to greedy
# SWLP — speculation changes throughput only.
#
# KV compression is intentionally OFF: the speculative path needs a plain,
# rollback-capable DynamicCache (see docs/phase5_design_decisions.md).

[model]
model_id = "unsloth/mistral-7b-instruct-v0.2"
local_model_path = ""
trust_remote_code = false
revision = ""

[cache]
cache_dir = ".cache/hf"
offline = false

[generation]
max_new_tokens = 32
temperature = 0.0
top_p = 1.0
do_sample = false
repetition_penalty = 1.0
seed = 42
prompt = "Explain in one sentence what makes a Macbook Air good for development."

[runtime]
device = "mps"
dtype = "float16"
backend = "speculative"
allow_mock_fallback = false
log_level = "INFO"
json_logs = false
profile = true
swlp_window_size = 4
swlp_prefetch_depth = 2
swlp_prefetch = true
swlp_double_buffer = false
swlp_pin_memory = false
swlp_fallback_to_baseline = false
kv_memory_budget_mb = 4096
kv_compression = false
kv_compression_level = 0
kv_tiering = false
shard_dir = "./shards/mistral-7b"
swlp_residency = "auto"
swlp_spec_ngram = 3
swlp_spec_max_draft = 8
