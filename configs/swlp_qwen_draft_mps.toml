# SWLP draft-model speculative decoding for Qwen2.5-14B on M5 (Apple Silicon).
# Phase 21: a resident Qwen2.5-0.5B-Instruct (~1 GB FP16) drafts up to
# swlp_spec_max_draft tokens per step; the streamed 14B target verifies them
# all in a single 48-layer disk sweep. Unlike the n-gram drafter (Phase 5),
# the draft model fires on novel text, so the speedup applies to all
# workloads. Output is bit-identical to greedy SWLP — speculation changes
# throughput only.
#
# The draft model MUST share the target's tokenizer (same Qwen2.5 family).
# KV compression is intentionally OFF: the speculative path needs a plain,
# rollback-capable DynamicCache (see docs/ROADMAP.md, "Appendix: Phase 5 design decisions").

[model]
model_id = "Qwen/Qwen2.5-14B-Instruct"
local_model_path = ""
trust_remote_code = false
revision = ""

[cache]
cache_dir = ".cache/hf"
offline = false

[generation]
max_new_tokens = 32
temperature = 0.0
top_p = 1.0
do_sample = false
repetition_penalty = 1.0
seed = 42
prompt = "Explain in one sentence what makes a Macbook Air good for development."

[runtime]
device = "mps"
dtype = "float16"
backend = "speculative"
allow_mock_fallback = false
log_level = "INFO"
json_logs = false
profile = true
swlp_window_size = 2
swlp_prefetch_depth = 2
swlp_prefetch = true
swlp_fallback_to_baseline = false
kv_memory_budget_mb = 4096
kv_compression = false
kv_compression_level = 0
kv_tiering = false
shard_dir = "./shards/qwen-14b"
swlp_residency = "auto"
swlp_spec_max_draft = 8
swlp_draft_model = "Qwen/Qwen2.5-0.5B-Instruct"
