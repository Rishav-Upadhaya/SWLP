# SWLP config for Qwen2.5-32B-Instruct on M5 (Apple Silicon, MPS).
# Streams per-layer weights from ./shards/qwen2.5-32b via StreamingScheduler.
# Physics estimate: ~64 layers x ~900 MB = ~57.6 GB; W=2 window ≈ 1.8 GB RAM peak.

[model]
model_id = "Qwen/Qwen2.5-32B-Instruct"
local_model_path = ""
trust_remote_code = false
revision = ""

[cache]
cache_dir = ".cache/hf"
offline = false

[generation]
max_new_tokens = 32
temperature = 0.0
top_p = 1.0
do_sample = false
repetition_penalty = 1.0
seed = 42
prompt = "Explain in one sentence what makes a Macbook Air good for development."

[runtime]
device = "mps"
dtype = "float16"
backend = "swlp"
allow_mock_fallback = false
log_level = "INFO"
json_logs = false
profile = true
swlp_window_size = 2
swlp_prefetch_depth = 2
swlp_prefetch = true
swlp_double_buffer = false
swlp_pin_memory = false
swlp_fallback_to_baseline = false
kv_memory_budget_mb = 4096
kv_compression = false
kv_compression_level = 0
kv_tiering = false
shard_dir = "./shards/qwen2.5-32b"
swlp_residency = "auto"
